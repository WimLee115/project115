// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // De google-services-plugin van Capacitor staat hier bewust niet meer.
        // Project115 gebruikt geen Firebase, geen push en geen analytics, dus
        // de plugin werd nooit toegepast. De regel liet Gradle het artefact
        // wel bij elke configuratie bij Google ophalen.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
