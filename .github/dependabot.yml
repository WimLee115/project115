version: 2

# ---------------------------------------------------------------------------
# Project115 draait offline en heeft bij runtime geen externe afhankelijkheden.
# De bouwketen heeft die wel, en daar komen kwetsbaarheden vandaan. Dependabot
# houdt die keten bij en opent een pull request zodra er iets te patchen valt.
#
# Beveiligingsupdates komen altijd binnen, ook buiten het onderstaande schema.
# De opties schedule, cooldown en open-pull-requests-limit gelden volgens de
# documentatie van GitHub uitsluitend voor versie-updates: een pull request die
# uit een beveiligingsalarm voortkomt wordt er niet door uitgesteld, niet door
# geblokkeerd en telt niet mee voor het maximum.
#
# De volgorde van de groepen doet ertoe. Dependabot plaatst een pakket in de
# eerste groep waarop het past, dus de specifieke groepen staan boven de brede.
# Onderaan elke npm-sectie staan twee vangnetten: een groep voor alle overige
# minor- en patch-updates, en een groep voor alle overige major-updates. Zonder
# die tweede groep valt elke major buiten alle groepen en krijgt hij een eigen
# pull request; dat is precies wat er op maandag 3 augustus 2026 gebeurde.
# ---------------------------------------------------------------------------

updates:
  # De webhub: Next.js, Drizzle, Argon2id, de hele serverkant.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Een uitgave moet hebben kunnen bezinken voordat wij hem overnemen. Een
    # versie die binnen een dag wordt teruggetrokken of gerepareerd bereikt de
    # repository daardoor nooit. Een major krijgt de langste wachttijd, omdat
    # daar de meeste haast in zit en de minste noodzaak. Deze wachttijden
    # gelden niet voor beveiligingsupdates.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # De engines-sleutel in package.json en de CI staan allebei op node 20.
      # Typen voor een nieuwere node beschrijven een omgeving die hier niet
      # draait. Deze regel vervalt zodra node zelf meegaat; hij houdt alleen de
      # major tegen, dus patches op de huidige reeks komen gewoon binnen.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 is de Go-herschrijving en levert de compiler-API pas in
      # 7.1. typescript-eslint weigert hem expliciet en Next.js kan er niet
      # mee bouwen. Deze regel vervalt zodra beide 7.x ondersteunen.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
    groups:
      # React en zijn typedefinities horen bij elkaar. Een losse bump van
      # @types/react beschrijft een React die nog niet geïnstalleerd is.
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # ESLint, zijn regelsets en de TypeScript-koppeling stellen peer-eisen aan
      # elkaar. Los bijwerken levert een installatie op die npm niet meer kan
      # oplossen: @eslint/js 10 eist eslint 10, terwijl eslint op 9 blijft staan.
      typecontrole-en-linting:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - typescript-eslint
          - "@typescript-eslint/*"
          - typescript
      # De overige typedefinities. Die van React zijn hierboven al weggevangen.
      typedefinities:
        applies-to: version-updates
        patterns:
          - "@types/*"
      # Alles wat hierboven niet is opgevangen, per week in één pull request.
      routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Het vangnet voor major-updates. Deze pull request verdient een eigen
      # avond; hij komt hooguit een paar keer per jaar langs.
      ingrijpend:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
      # Beveiligingsupdates ook gegroepeerd, maar apart zichtbaar.
      beveiliging:
        applies-to: security-updates
        patterns:
          - "*"

  # De Android-schil: Capacitor, Vite en de bouwscripts.
  - package-ecosystem: npm
    directory: /android-app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Zelfde reden als in de webhub: de schil bouwt op node 20.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # De schil bouwt met Vite en heeft geen linter, dus TypeScript 7 valt
      # hier niet om. Beide werkmappen typecheckt wel dezelfde vragenbank in
      # content/, en die hoort niet door twee compilergeneraties te gaan.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
    groups:
      # Capacitor is een stel pakketten met een gedeeld versienummer. Een schil
      # waarin @capacitor/core en @capacitor/android niet gelijk lopen, bouwt
      # wel maar draait niet betrouwbaar.
      capacitor:
        applies-to: version-updates
        patterns:
          - "@capacitor/*"
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Vite, zijn React-plugin en TypeScript vormen samen de bouwketen van de
      # schil. Ze breken in elkaars gezelschap, dus ze reizen samen.
      bouwketen:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - tsx
          - tailwindcss
          - "@tailwindcss/*"
      typedefinities:
        applies-to: version-updates
        patterns:
          - "@types/*"
      routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      ingrijpend:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
      beveiliging:
        applies-to: security-updates
        patterns:
          - "*"

  # Gradle-afhankelijkheden van de Android-build.
  #
  # Wat Dependabot hier kan zien is beperkt. Hij leest build.gradle en de
  # kts-variant, de settings-bestanden, gradle.properties, gradle.lockfile,
  # gradle/libs.versions.toml, gradle/wrapper/gradle-wrapper.properties, de
  # buildbestanden van de subprojecten uit settings.gradle, en bestanden die
  # via apply worden ingeladen en het woord "dependencies" in hun naam hebben.
  # android-app/android/variables.gradle voldoet aan geen van die voorwaarden,
  # dus de androidx-, junit- en espresso-versies die daar in het ext-blok staan
  # blijven buiten beeld. Hetzelfde geldt voor de map
  # capacitor-cordova-android-plugins, want die wordt door cap sync gegenereerd
  # en staat niet in git.
  #
  # In de praktijk gaat deze sectie daarmee over precies twee dingen: de
  # classpath-regel com.android.tools.build:gradle in build.gradle, en de
  # Gradle-wrapper. De tweede classpath-regel, com.google.gms:google-services,
  # is uit build.gradle verwijderd omdat die plugin hier nooit werd toegepast.
  - package-ecosystem: gradle
    directory: /android-app/android
    schedule:
      interval: monthly
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - android
    # Zonder dit blok valt Dependabot terug op zijn eigen standaard en worden
    # het build(deps)-berichten, terwijl de rest van de repository deps
    # aanhoudt.
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # De Gradle-wrapper. Dependabot noemt die letterlijk "gradle-wrapper";
      # dat is geen maven-coordinaat maar een naam die de gradle-parser zelf
      # verzint voor de distributionUrl in gradle-wrapper.properties.
      #
      # Gradle 9.6.0 heeft org.gradle.api.problems.internal.InternalProblems
      # verwijderd. Android Gradle Plugin 8.13.0 leunt daarop, en de build valt
      # daardoor al in de configuratiefase om. Nagebouwd met JDK en Android
      # SDK: 9.5.0 werkt wel met AGP 8.13.0, 9.6.0 en hoger niet.
      #
      # Bewust een versiegrens en geen ignore op semver-major. Een major-ignore
      # rekent vanaf de versie die er nu staat, dus zodra de wrapper ooit op
      # 9.x zou staan houdt die 9.6 niet meer tegen. Deze grens blijft gelden
      # waar de wrapper ook staat, en werkt als enige vorm ook door in
      # beveiligingsupdates. Alles onder 9.6 komt gewoon binnen en wordt door
      # de stap Gradle-configuratie controleren in ci.yml getoetst.
      #
      # Deze regel mag weg zodra Capacitor AGP 9 ondersteunt, want pas dan mag
      # de wrapper naar 9.6 of hoger.
      - dependency-name: "gradle-wrapper"
        versions:
          - ">= 9.6"
      # De Android Gradle Plugin zelf: dezelfde klem, van de andere kant. AGP 9
      # is uit, maar de zeven Capacitor-modules onder node_modules staan op
      # 8.13.0 en het gegenereerde capacitor-cordova-android-plugins ook. Een
      # bump van deze ene zichtbare classpath-regel zet de hoofdmap op een
      # andere AGP dan de rest van de build; getest met 9.3.1 en dat faalt.
      # Vervalt op hetzelfde moment als de regel hierboven. Minors en patches
      # binnen 8.x komen gewoon binnen.
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - version-update:semver-major
    groups:
      gradle:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gradle-ingrijpend:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
      beveiliging:
        applies-to: security-updates
        patterns:
          - "*"

  # De basisimage van de container: node:24-bookworm-slim, twee keer in de
  # Dockerfile in de hoofdmap.
  #
  # Let op: Dependabot doet voor het docker-ecosysteem alleen versie-updates,
  # geen beveiligingsupdates. Een kwetsbaarheid in de basisimage komt hier dus
  # niet vanzelf binnen.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    # Het docker-ecosysteem ondersteunt alleen default-days, geen aparte
    # wachttijden per semver-niveau.
    cooldown:
      default-days: 7
    ignore:
      # Dependabot kent het verschil tussen een LTS-uitgave en een tussenversie
      # niet. Node brengt elk oneven nummer uit als kortlopende reeks: 25 kwam
      # uit in oktober 2025 en was op 1 juni 2026 alweer uit onderhoud, terwijl
      # 24 tot april 2028 patches krijgt. Zonder deze regel stelde Dependabot
      # precies die stap achteruit voor.
      #
      # De image gebruikt bovendien de node_modules van de host, dus de
      # hoofdversie moet met de host meebewegen en niet alleen hier. De sprong
      # naar de volgende LTS is daarom handwerk: node 26 wordt op 28 oktober
      # 2026 LTS. Patches binnen 24.x komen gewoon binnen.
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
    groups:
      basisimages:
        applies-to: version-updates
        patterns:
          - "*"

  # De images die docker-compose.yml erbij haalt, op dit moment caddy:2-alpine.
  # Dat is een eigen ecosysteem: het docker-ecosysteem hierboven leest de
  # Dockerfile, niet de compose-bestanden.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    cooldown:
      default-days: 7
    groups:
      compose-images:
        applies-to: version-updates
        patterns:
          - "*"

  # Acties in eigen workflows. Die draaien met repotoegang, dus die tellen mee.
  # De waarde / is hier voorgeschreven: Dependabot zoekt zelf in
  # .github/workflows en in een action.yml in de hoofdmap.
  #
  # Wekelijks in plaats van maandelijks. Een gecompromitteerde action is het
  # soort probleem waarbij drie weken wachten het verschil maakt, en omdat alles
  # in een groep valt kost het hooguit één pull request per week.
  #
  # De actions staan op hun commit-SHA met de tag als commentaar erachter. Die
  # vorm werkt Dependabot bij, inclusief het commentaar, mits het op dezelfde
  # regel staat.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    groups:
      acties:
        applies-to: version-updates
        patterns:
          - "*"
      beveiliging:
        applies-to: security-updates
        patterns:
          - "*"
