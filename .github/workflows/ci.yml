name: CI

# Draait op elke push naar main en op elk pull request. Dit is meteen de
# statuscheck die je bij branch protection kunt verplichten, zodat een
# Dependabot-PR pas te mergen is als de app er nog van bouwt.
#
# De actions staan vastgezet op hun commit-SHA, niet op een tag. Een tag als
# `v7` kan door de eigenaar naar een andere commit worden verplaatst; een SHA
# niet. Dat scheelt een aanvalsroute die de laatste jaren vaker is misbruikt.
# Dependabot houdt ze bij en zet de nieuwe SHA in een pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Niets in deze workflow hoeft te schrijven.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webhub:
    name: Webhub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Typecontrole
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Productiebuild
        run: npm run build

  android:
    name: Android-schil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # De runner heeft vijf JDK's staan en 17 is er de standaard. Welke dat is
      # bepaalt GitHub, niet dit project: bij een nieuwe runner-image kan die
      # standaard opschuiven zonder dat hier een regel verandert. Daarom pinnen
      # we hem. 21 is wat Capacitor in capacitor.build.gradle als source- en
      # targetCompatibility vastlegt, dus dat is de versie waar de Android-build
      # op hoort te draaien.
      #
      # cache: gradle bewaart ~/.gradle/caches en ~/.gradle/wrapper. De wrapper
      # krijgt een eigen sleutel op gradle-wrapper.properties, dus juist een
      # pull request die de Gradle-versie optilt krijgt gegarandeerd geen
      # cachetreffer en haalt de nieuwe distributie echt op. Dat is hier de
      # bedoeling: die moet op de nieuwe Gradle getoetst worden.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            android-app/android/**/*.gradle*
            android-app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Afhankelijkheden installeren
        working-directory: android-app
        run: npm ci

      - name: Typecontrole
        working-directory: android-app
        run: npm run typecheck

      - name: Tests
        working-directory: android-app
        run: npm test

      - name: Webbuild
        working-directory: android-app
        run: npm run build

      # capacitor-cordova-android-plugins staat in .gitignore en wordt door
      # cap sync aangemaakt. Op een verse checkout bestaat die map dus niet en
      # struikelt Gradle meteen over cordova.variables.gradle, dat vanuit
      # capacitor.build.gradle wordt ingelezen. Deze stap moet daarom na de
      # webbuild staan: cap sync kopieert dist/ mee.
      - name: Capacitor synchroniseren
        working-directory: android-app
        run: npx cap sync android

      # Hier zat een gat. Geen enkele job raakte Gradle aan, dus een
      # Dependabot-pull-request die alleen gradle-wrapper.properties aanpast
      # kwam met allemaal groene vinkjes binnen. Dat is bijna misgegaan: de
      # voorgestelde bump naar Gradle 9.6.1 sloopt de configuratiefase, omdat
      # Gradle 9.6.0 org.gradle.api.problems.internal.InternalProblems heeft
      # verwijderd en Android Gradle Plugin 8.13.0 daarop leunt. De build faalt
      # dan op "Failed to apply plugin 'com.android.internal.application'".
      # Zonder deze stap was dat pas bij de eerstvolgende npm run
      # android:release opgevallen, weken later, wanneer niet meer te zien is
      # welke samenvoeging het gedaan heeft.
      #
      # --dry-run bouwt niets. Gradle configureert alle negen modules, past in
      # elk daarvan de Android-plugin toe en stelt de volledige taakgraaf
      # samen, en voert die dan niet uit. Dat is precies de fase waarin het
      # misgaat, tegen een fractie van de kosten van een echte build. Debug en
      # release allebei, want de release-variant heeft zijn eigen configuratie
      # en loopt hier zonder keystore.properties langs hetzelfde pad als een
      # verse kloon.
      - name: Gradle-configuratie controleren
        working-directory: android-app/android
        run: ./gradlew assembleDebug assembleRelease --dry-run

  content:
    name: Vragenbank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      # De vragenbank valideert zichzelf: dekt elk assessment-criterium een
      # vraag, tellen de wegingen op tot 100%, heeft elke vraag precies vier
      # opties en precies één juist antwoord. Dat hoort te falen vóór een
      # uitgave, niet erna.
      - name: Vragenbank valideren
        run: npx tsx scripts/validate-content.ts

      # Structuur kan kloppen terwijl een afleider inhoudelijk te dicht bij het
      # juiste antwoord ligt. Dat is geen bouwfout maar een leerfout, en die
      # weegt zwaarder: iemand studeert hierop voor een examen dat geld kost.
      - name: Afleiders controleren
        run: npx tsx scripts/check-afleiders.ts

  audit:
    name: Afhankelijkheden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Alleen wat daadwerkelijk wordt uitgeleverd. Een kwetsbaarheid in een
      # bouwgereedschap staat niet in de app die je installeert; die volgt
      # Dependabot apart op.
      - name: npm audit (uitgeleverde afhankelijkheden)
        run: npm audit --omit=dev --audit-level=moderate
